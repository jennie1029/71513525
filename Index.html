
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一個網頁</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      text-align: center;
    }

    header {
      width: 100%;
      padding: 30px 16px;
      background: #2563eb;
      color: white;
    }

    main {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 30px 16px;
    }

    button {
      padding: 12px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>我的第一個網頁</h1>
    <p>歡迎來到我的網站！</p>
  </header>

  <main>
    <h2>網頁內容</h2>
    <p>這個網頁會自動適應不同螢幕的寬度。</p>
    <button onclick="alert('網頁執行成功！')">
      點我測試
    </button>
  </main>
</body>
</html>
